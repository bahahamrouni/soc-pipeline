bind 0.0.0.0
port 6379
protected-mode no
# Password is supplied at start-up by docker-compose (--requirepass, from REDIS_PASSWORD in .env).
maxmemory 512mb
maxmemory-policy allkeys-lru
appendonly yes
appendfilename "redis-soc.aof"
appendfsync everysec
save ""
hz 15
tcp-keepalive 60
timeout 300
loglevel notice