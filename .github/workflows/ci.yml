name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Only real errors: syntax errors and undefined names (no style rules).
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 services validation

      - name: Byte-compile all Python files
        run: python -m compileall -q services validation

  docker:
    name: Compose validation and image builds
    runs-on: ubuntu-latest
    needs: python-checks
    env:
      # CI-only placeholders so the compose file's required-variable checks pass.
      POSTGRES_PASSWORD: ci-only-placeholder
      REDIS_PASSWORD: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example file
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build all service images
        run: docker compose build
